# Versionen. Stand 28.08.2026.
#
# AGP 9.3.0 ist die letzte stabile Version (Juli 2026) und bringt Kotlin-
# Unterstützung eingebaut mit — das Plugin org.jetbrains.kotlin.android wird
# NICHT mehr angewendet. Wear OS 6 basiert auf Android 16, also compileSdk 36.
#
# Sollte die erste CI-Runde eine Version nicht auflösen können, steht die
# Fehlermeldung im Job "build" — dann hier korrigieren, nicht in den Modulen.

[versions]
agp                = "9.3.0"
coreKtx            = "1.13.1"
complicationsDs    = "1.3.0"   # androidx.wear.watchface, Complications-APIs (nicht deprecated)
coroutines         = "1.8.1"
junit              = "4.13.2"

compileSdk         = "36"      # Wear OS 6 / Android 16
minSdk             = "34"      # Wear OS 5 — Puffer, falls eine Uhr noch nicht aktualisiert ist
targetSdk          = "36"

[libraries]
core-ktx            = { module = "androidx.core:core-ktx",                                          version.ref = "coreKtx" }
complications-ds    = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "complicationsDs" }
complications-rend  = { module = "androidx.wear.watchface:watchface-complications-rendering",       version.ref = "complicationsDs" }
coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",                version.ref = "coroutines" }
junit               = { module = "junit:junit",                                                     version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
